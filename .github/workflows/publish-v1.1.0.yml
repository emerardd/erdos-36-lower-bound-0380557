name: Publish v1.1.0

on:
  push:
    branches:
      - 'release/v1.1.0-publisher'
    paths:
      - '.github/workflows/publish-v1.1.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source CI identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '34121043212'
          TARGET_SHA: 'f93ccde47f16e284fcc713eee56579cf1c36578c'
        run: |
          set -euo pipefail
          data="$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha)"
          echo "$data"
          test "$(jq -r .conclusion <<<"$data")" = "success"
          test "$(jq -r .headSha <<<"$data")" = "$TARGET_SHA"

      - name: Download exact CI release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '34121043212'
        run: |
          set -euo pipefail
          mkdir -p release-assets verification-assets
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "weighted-038056070-release-$SOURCE_RUN" \
            --dir release-assets
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "weighted-038056070-verification-$SOURCE_RUN" \
            --dir verification-assets
          test -s release-assets/paper.pdf
          test -s release-assets/arxiv-source.zip
          test -s release-assets/SHA256SUMS.txt
          transcript="$(find verification-assets -type f -name ci_release_verification.txt -print -quit)"
          test -n "$transcript"
          cp "$transcript" release-assets/verification-transcript.txt
          test -s release-assets/verification-transcript.txt
          grep -q 'GLOBAL CERTIFIED c_E > 0.38056070' release-assets/verification-transcript.txt
          grep -q 'compile_mode: system mpfr.h' release-assets/verification-transcript.txt
          sha256sum release-assets/paper.pdf release-assets/arxiv-source.zip release-assets/SHA256SUMS.txt release-assets/verification-transcript.txt

      - name: Create v1.1.0 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 'v1.1.0'
          TARGET_SHA: 'f93ccde47f16e284fcc713eee56579cf1c36578c'
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          Certified lower bound for Erdős' minimum-overlap constant:

          ```text
          c_E > 0.38056070
          ```

          This release replaces the two binding central mean bins in Price's 172-bin framework with a frozen combined spectral certificate, while retaining Price's published Arb-certified bounds for the other 170 bins.

          ## Trusted proof chain

          1. `certificate/weighted_center_combined_038056070.txt` — standalone finite-decimal combined center certificate.
          2. `code/check_weighted_combined_certificate.py` — exact-rational validity check of the combined weighted-Parseval / harmonic decomposition.
          3. `code/verify_weighted_center_mpfr.c` plus `code/run_weighted_mpfr_verification.py` — direct MPFR interval verification with system `<mpfr.h>` and exact chunk aggregation.
          4. The 170 vendored Price/Arb noncentral-bin reports.

          The clean-checkout verification on commit `f93ccde47f16e284fcc713eee56579cf1c36578c` gives

          ```text
          D_upper = 2.6277015654965400783119252258824342295786...
          target_D = 2.6277017043536024607900920930616324807054...
          margin_D = 1.3885706238247816686717919825e-7
          CERTIFIED True
          GLOBAL CERTIFIED c_E > 0.38056070
          ```

          The optimizer and historical floating-point / Python interval experiments are outside the trusted proof path. The center verifier was developed within this project; this release is not claimed to be an external third-party audit.

          ## Assets

          - `paper.pdf` — reproducibly built proof note.
          - `arxiv-source.zip` — source package for arXiv submission/update.
          - `SHA256SUMS.txt` — release integrity manifest generated by clean-checkout CI.
          - `verification-transcript.txt` — exact CI transcript for the successful frozen verification.

          Source CI run: https://github.com/emerardd/erdos-36-lower-bound-0380557/actions/runs/34121043212
          EOF
          gh release create "$TAG" \
            release-assets/paper.pdf \
            release-assets/arxiv-source.zip \
            release-assets/SHA256SUMS.txt \
            release-assets/verification-transcript.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "v1.1.0 — certified lower bound c_E > 0.38056070" \
            --notes-file release-notes.md

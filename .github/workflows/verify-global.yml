name: Verify global bound c_E > 0.38056070

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-global.yml'
      - 'code/**'
      - 'certificate/**'
      - 'verification/**'
      - 'vendor/**'
      - 'requirements.txt'
      - 'paper.tex'
      - 'SHA256SUMS.txt'
  pull_request:
    paths:
      - '.github/workflows/verify-global.yml'
      - 'code/**'
      - 'certificate/**'
      - 'verification/**'
      - 'vendor/**'
      - 'requirements.txt'
      - 'paper.tex'
      - 'SHA256SUMS.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen byte manifests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          sha256sum -c vendor/price/SHA256SUMS.txt
          (cd vendor/price/certificate && sed 's/\r$//' SHA256SUMS.txt | sha256sum -c)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install MPFR/GMP headers
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpfr-dev libgmp-dev

      - name: Run complete frozen verification
        shell: bash
        env:
          JOBS: '2'
        run: |
          set -euo pipefail
          bash code/run_release_verification.sh 2>&1 | tee verification/ci_release_verification.txt
          grep -q 'GLOBAL CERTIFIED c_E > 0.38056070' verification/ci_release_verification.txt
          grep -q 'compile_mode: system mpfr.h' verification/ci_release_verification.txt
          if grep -q 'MPFR_SELFDECL LP64 fallback' verification/ci_release_verification.txt; then
            echo 'release verification used unsupported MPFR fallback' >&2
            exit 1
          fi

      - name: Build release paper and arXiv package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          bash code/build_paper.sh
          rm -f arxiv-source.zip
          zip -X -9 arxiv-source.zip paper.tex
          test -s paper.pdf
          test -s arxiv-source.zip
          unzip -p arxiv-source.zip paper.tex | cmp - paper.tex

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weighted-038056070-release-${{ github.run_id }}
          path: |
            paper.pdf
            arxiv-source.zip
          retention-days: 90

      - name: Upload verification transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weighted-038056070-verification-${{ github.run_id }}
          path: verification/ci_release_verification.txt
          retention-days: 90

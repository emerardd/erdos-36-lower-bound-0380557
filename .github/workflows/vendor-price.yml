name: Vendor Price certificate package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-price.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned Price repository
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT=6bc610e40083ef61a40966dfb5d38612cabc4c5b
          git clone --filter=blob:none --no-checkout https://github.com/Leeham06972452/erdos-36-lower-bound.git /tmp/price
          git -C /tmp/price checkout "$UPSTREAM_COMMIT"
          rm -rf vendor/price
          mkdir -p vendor/price
          cp -a /tmp/price/certificate vendor/price/certificate
          cp /tmp/price/README.md vendor/price/UPSTREAM_README.md
          printf '%s\n' "$UPSTREAM_COMMIT" > vendor/price/UPSTREAM_COMMIT.txt
          cat > vendor/price/README.md <<'EOF'
          # Vendored Price certificate package

          This directory is a byte-for-byte copy of the `certificate/` directory
          from Liam Price's public repository `Leeham06972452/erdos-36-lower-bound`,
          pinned at the commit recorded in `UPSTREAM_COMMIT.txt`.

          The files are included for reproducibility and provenance.  The noncentral
          mean-bin certificates are due to Price.  This repository's new contribution
          replaces only bins 85 and 86 with the hybrid Parseval certificate.
          EOF

      - name: Record vendored hashes
        shell: bash
        run: |
          set -euo pipefail
          find vendor/price -type f -print0 | sort -z | xargs -0 sha256sum > vendor/price/SHA256SUMS.txt

      - name: Commit vendored package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/price
          if git diff --cached --quiet; then
            echo 'No vendoring changes.'
            exit 0
          fi
          git commit -m 'Vendor pinned Price certificate package'
          git push origin HEAD:main

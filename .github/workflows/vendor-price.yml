name: Vendor Price certificate package

# This workflow rewrites vendor/ and pushes to main, so it deliberately does
# not run on pull requests.  Re-vendoring is an explicit maintainer action.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-price.yml'
      - '.github/vendor-price-README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned Price repository
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT=6bc610e40083ef61a40966dfb5d38612cabc4c5b
          git clone --filter=blob:none --no-checkout https://github.com/Leeham06972452/erdos-36-lower-bound.git /tmp/price
          git -C /tmp/price checkout "$UPSTREAM_COMMIT"
          rm -rf vendor/price
          mkdir -p vendor/price
          cp -a /tmp/price/certificate vendor/price/certificate
          cp /tmp/price/README.md vendor/price/UPSTREAM_README.md
          printf '%s\n' "$UPSTREAM_COMMIT" > vendor/price/UPSTREAM_COMMIT.txt
          cp "$GITHUB_WORKSPACE/.github/vendor-price-README.md" vendor/price/README.md

      - name: Record vendored hashes
        shell: bash
        run: |
          set -euo pipefail
          # Exclude the manifest itself: hashing a file into which the hashes are
          # being written yields a self-referential entry that can never verify.
          # Binary mode (-b) so the manifest is byte-identical whether it is
          # regenerated here or on a maintainer's machine.
          find vendor/price -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum -b > vendor/price/SHA256SUMS.txt

      - name: Commit vendored package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/price
          if git diff --cached --quiet; then
            echo 'No vendoring changes.'
            exit 0
          fi
          git commit -m 'Vendor pinned Price certificate package'
          git push origin HEAD:main
